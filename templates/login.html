<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Máquinas Intela</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#1a3a5c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .caja{background:#fff;border-radius:14px;padding:34px;width:340px}
  h1{font-size:17px;letter-spacing:.06em;color:#1a3a5c;margin:0 0 20px;text-align:center}
  input{width:100%;height:46px;padding:0 12px;font-size:16px;border:1px solid #d1d5db;
        border-radius:8px;margin-bottom:14px;box-sizing:border-box}
  button{width:100%;height:46px;border:0;border-radius:8px;background:#2563eb;color:#fff;
         font-size:16px;font-weight:700;cursor:pointer}
  .flash{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:8px;margin-bottom:14px;
         font-size:14px;text-align:center}
</style>
</head>
<body>
  <form class="caja" method="POST">
    <h1>MÁQUINAS · INTELA</h1>
    {% with m = get_flashed_messages() %}
      {% for x in m %}<div class="flash">{{ x }}</div>{% endfor %}
    {% endwith %}
    <input type="password" name="password" placeholder="Contraseña" autofocus required>
    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
