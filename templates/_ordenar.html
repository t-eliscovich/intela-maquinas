{# Ordenar una tabla tocando el título de la columna. Vale para cualquier
   tabla con class="ordenable" y `th class="ordena" data-orden="numero|texto"`.
   La fila en blanco de abajo no se mueve nunca: es para agregar, no es un
   dato. #}
<script>
document.querySelectorAll("table.ordenable").forEach(function (tabla) {
  if (!tabla.tBodies.length) { return; }
  var cuerpo = tabla.tBodies[0];

  function numero(texto) {
    var limpio = texto.replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", ".");
    var x = parseFloat(limpio);
    return isFinite(x) ? x : null;
  }
  function valor(fila, i, tipo) {
    var celda = fila.children[i];
    var texto = celda ? celda.textContent.trim() : "";
    if (texto === "—" || texto === "") { return null; }
    return tipo === "numero" ? numero(texto) : texto.toLowerCase();
  }

  tabla.querySelectorAll("thead th.ordena").forEach(function (th) {
    th.addEventListener("click", function () {
      var i = Array.prototype.indexOf.call(th.parentNode.children, th);
      var tipo = th.dataset.orden;
      var subiendo = th.dataset.como !== "sube";
      tabla.querySelectorAll("thead th.ordena").forEach(function (otra) {
        if (otra !== th) { otra.removeAttribute("data-como"); otra.classList.remove("ordenada"); }
      });
      th.dataset.como = subiendo ? "sube" : "baja";
      th.classList.add("ordenada");

      var filas = Array.prototype.filter.call(cuerpo.children, function (f) {
        return !f.classList.contains("nueva");
      });
      var nueva = cuerpo.querySelector("tr.nueva");
      filas.sort(function (a, b) {
        var x = valor(a, i, tipo), y = valor(b, i, tipo);
        // Lo que no tiene dato va siempre al final, se ordene como se ordene.
        if (x === null && y === null) { return 0; }
        if (x === null) { return 1; }
        if (y === null) { return -1; }
        if (x < y) { return subiendo ? -1 : 1; }
        if (x > y) { return subiendo ? 1 : -1; }
        return 0;
      });
      filas.forEach(function (f) { cuerpo.appendChild(f); });
      if (nueva) { cuerpo.appendChild(nueva); }
    });
  });
});
</script>
