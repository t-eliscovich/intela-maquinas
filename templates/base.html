<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Máquinas{% endblock %} — Mantenimiento Intela</title>
<style>
  :root{
    --azul:#1a3a5c; --azul-claro:#2563eb; --borde:#e2e8f0; --gris:#64748b;
    --rojo:#dc2626; --amarillo:#d97706; --verde:#16a34a; --fondo:#f8fafc;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--fondo);color:#0f172a;font-size:15px}
  header{background:var(--azul);color:#fff;padding:0 24px;display:flex;align-items:center;gap:28px}
  header .marca{font-weight:700;letter-spacing:.06em;font-size:14px;padding:16px 0}
  header nav{display:flex;gap:4px;flex:1}
  header nav a{color:#cbd5e1;text-decoration:none;padding:16px 14px;font-size:14px;font-weight:600}
  header nav a:hover{color:#fff}
  header nav a.activo{color:#fff;box-shadow:inset 0 -3px 0 #fff}
  .container{max-width:1500px;margin:0 auto;padding:24px}
  h1{font-size:24px;color:var(--azul);margin:0 0 4px}
  .sub{color:var(--gris);font-size:14px;margin:0 0 20px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:12px;
        box-shadow:0 1px 2px rgba(15,23,42,.04);padding:20px 22px;margin-bottom:20px}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);
         font-weight:700;border-left:3px solid var(--azul-claro);padding-left:8px;margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  th{background:var(--azul);color:#fff;font-size:13px;font-weight:700;text-align:left;
     padding:11px 12px;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .der{text-align:right;font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;
        white-space:nowrap}
  .chip.vencido{background:#fee2e2;color:var(--rojo)}
  .chip.por_vencer{background:#fef3c7;color:var(--amarillo)}
  .chip.ok{background:#dcfce7;color:var(--verde)}
  .chip.sin_umbral{background:#e2e8f0;color:var(--gris)}
  .barra{height:6px;border-radius:3px;background:#e2e8f0;overflow:hidden;min-width:70px;margin-top:4px}
  .barra span{display:block;height:100%}
  form.formulario{display:grid;gap:16px;max-width:560px}
  label.campo{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
              color:var(--gris);font-weight:700;margin-bottom:6px}
  input,select,textarea{width:100%;height:44px;padding:0 12px;font-size:16px;
        border:1px solid #d1d5db;border-radius:8px;background:#fff;font-family:inherit}
  textarea{height:auto;padding:10px 12px;min-height:70px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul-claro);
        box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;
       border:0;border-radius:8px;background:var(--azul-claro);color:#fff;font-size:15px;
       font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit}
  .btn:hover{background:#1d4ed8}
  .btn.gris{background:#fff;color:var(--azul);border:1px solid #cbd5e1}
  .flash{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-weight:600}
  .flash.ok{background:#dcfce7;color:#15803d}
  .flash.error{background:#fee2e2;color:#b91c1c}
  .aviso{background:#fef3c7;color:#92400e;padding:12px 16px;border-radius:8px;margin-bottom:16px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:14px 20px;min-width:130px}
  .kpi b{display:block;font-size:28px;line-height:1.1}
  .kpi small{color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .vacio{text-align:center;color:var(--gris);padding:40px 20px}
  .fila-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:720px){.fila-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="marca">MÁQUINAS · INTELA</div>
  <nav>
    <a href="{{ url_for('semaforo') }}"     class="{{ 'activo' if request.endpoint=='semaforo' }}">Semáforo</a>
    <a href="{{ url_for('registrar') }}"    class="{{ 'activo' if request.endpoint=='registrar' }}">Cargar service</a>
    <a href="{{ url_for('tipos_view') }}"   class="{{ 'activo' if request.endpoint=='tipos_view' }}">Tipos de service</a>
    <a href="{{ url_for('arranque') }}"     class="{{ 'activo' if request.endpoint=='arranque' }}">Arranque</a>
  </nav>
</header>

<div class="container">
  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}
      <div class="flash {{ categoria }}">{{ mensaje }}</div>
    {% endfor %}
  {% endwith %}
  {% block contenido %}{% endblock %}
</div>
</body>
</html>
